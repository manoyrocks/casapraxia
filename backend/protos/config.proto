syntax = "proto3";

package praxia.config.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/praxia-ai/backend/pkg/gen/config/v1";

// ConfigService manages therapy program configuration
service ConfigService {
  rpc GetProgram(GetProgramRequest) returns (GetProgramResponse);
  rpc GetTargets(GetTargetsRequest) returns (GetTargetsResponse);
  rpc GetCueHierarchy(GetCueHierarchyRequest) returns (GetCueHierarchyResponse);
  rpc GetAAC(GetAACRequest) returns (GetAACResponse);
}

// GetProgramRequest
message GetProgramRequest {
  string child_id = 1;
}

message Program {
  string id = 1;
  string name = 2;
  int32 version = 3;
  string description = 4;
  google.protobuf.Timestamp created_at = 5;
}

message GetProgramResponse {
  Program program = 1;
}

// GetTargetsRequest
message GetTargetsRequest {
  string child_id = 1;
  string program_id = 2;
}

message Target {
  string id = 1;
  string word = 2;
  string phonetic_features = 3; // IPA
  float stimulability_score = 4;
  google.protobuf.Timestamp created_at = 5;
}

message GetTargetsResponse {
  repeated Target targets = 1;
}

// GetCueHierarchyRequest
message GetCueHierarchyRequest {
  string target_id = 1;
  string program_id = 2;
}

message CueLevel {
  int32 level = 1; // 0-5
  string description = 2;
  string visual_cue = 3;
  string gestural_cue = 4;
  string rhythmic_cue = 5;
  string frame_cue = 6;
}

message CueHierarchy {
  string target_id = 1;
  int32 version = 2;
  repeated CueLevel levels = 3;
  google.protobuf.Timestamp created_at = 4;
}

message GetCueHierarchyResponse {
  CueHierarchy hierarchy = 1;
}

// GetAACRequest
message GetAACRequest {
  string child_id = 1;
}

message AACCell {
  int32 position = 1; // 0-7 for 8-cell board
  string emoji = 2;
  string text = 3;
  string target_word = 4;
  bool active = 5;
}

message AACBoard {
  string child_id = 1;
  repeated AACCell cells = 2;
  int32 version = 3;
  google.protobuf.Timestamp created_at = 4;
}

message GetAACResponse {
  AACBoard board = 1;
}
