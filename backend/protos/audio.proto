syntax = "proto3";

package praxia.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/praxia-ai/backend/pkg/gen/praxia/v1;praxiav1";
option swift_prefix = "Praxia";

// AudioService manages audio upload presigning, verification, and status tracking
service AudioService {
  rpc PresignAudioUpload(PresignAudioUploadRequest) returns (PresignAudioUploadResponse);
  rpc VerifyAudioUpload(VerifyAudioUploadRequest) returns (VerifyAudioUploadResponse);
  rpc GetAudioStatus(GetAudioStatusRequest) returns (GetAudioStatusResponse);
  rpc DeleteAudioAfterRetention(DeleteAudioAfterRetentionRequest) returns (DeleteAudioAfterRetentionResponse);
}

// ============================================================================
// ENUMS
// ============================================================================

enum AudioStatus {
  AUDIO_STATUS_UNSPECIFIED = 0;
  PENDING = 1;          // not yet uploaded
  UPLOADED = 2;         // verified on S3
  EXPIRED = 3;          // past retention period
  DELETED = 4;          // deleted per retention policy
}

enum RetentionClass {
  RETENTION_UNSPECIFIED = 0;
  NONE = 1;             // discard immediately
  ON_DEVICE_90D = 2;    // local storage, 90 days
  CLOUD_90D = 3;        // S3, 90 days
  KEEPSAKE_INDEFINITE = 4;  // indefinite, keepsake clip
}

// ============================================================================
// PRESIGN AUDIO UPLOAD (Client initiates S3 upload)
// ============================================================================

message PresignAudioUploadRequest {
  string child_id = 1;
  string attempt_id = 2;
  int64 content_length_bytes = 3;
  string content_hash_sha256 = 4;         // hex-encoded SHA256
}

message PresignAudioUploadResponse {
  string s3_url = 1;                      // pre-signed PUT URL
  string method = 2;                      // "PUT"
  int32 expiry_seconds = 3;               // 15 minutes typical
  map<string, string> headers = 4;        // auth headers for presigned URL
}

// ============================================================================
// VERIFY AUDIO UPLOAD (Server confirms S3 received file)
// ============================================================================

message VerifyAudioUploadRequest {
  string child_id = 1;
  string attempt_id = 2;
  string content_hash_sha256 = 3;         // verify checksum
}

message VerifyAudioUploadResponse {
  bool verified = 1;
  string error_message = 2;
  google.protobuf.Timestamp verified_at = 3;
}

// ============================================================================
// GET AUDIO STATUS
// ============================================================================

message GetAudioStatusRequest {
  string child_id = 1;
  string attempt_id = 2;
}

message GetAudioStatusResponse {
  string attempt_id = 1;
  AudioStatus status = 2;
  string s3_key = 3;
  RetentionClass retention_class = 4;
  google.protobuf.Timestamp retention_expires_at = 5;
  google.protobuf.Timestamp uploaded_at = 6;
}

// ============================================================================
// DELETE AUDIO AFTER RETENTION (Compliance cleanup job)
// ============================================================================

message DeleteAudioAfterRetentionRequest {
  string child_id = 1;
  string attempt_id = 2;
}

message DeleteAudioAfterRetentionResponse {
  bool deleted = 1;
  string deletion_receipt = 2;            // audit log reference
  google.protobuf.Timestamp deleted_at = 3;
}
