syntax = "proto3";

package praxia.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/praxia-ai/backend/pkg/gen/praxia/v1;praxiav1";
option swift_prefix = "Praxia";

// TrialService manages speech therapy trial upload and retrieval
service TrialService {
  rpc UploadSession(UploadSessionRequest) returns (UploadSessionResponse);
  rpc GetSessionTrials(GetSessionTrialsRequest) returns (GetSessionTrialsResponse);
  rpc GetChildProgress(GetChildProgressRequest) returns (GetChildProgressResponse);
  rpc QueryTrials(QueryTrialsRequest) returns (stream TrialEvent);
}

// ============================================================================
// ENUMS
// ============================================================================

enum ScoreValue {
  SCORE_UNSPECIFIED = 0;
  GOT_IT = 1;
  CLOSE = 2;
  NOT_YET = 3;
  ABSTAIN = 4;
}

enum CueLevel {
  CUE_LEVEL_UNSPECIFIED = 0;
  L0 = 1;
  L1 = 2;
  L2 = 3;
  L3 = 4;
  L4 = 5;
  L5 = 6;
}

enum PitchContour {
  PITCH_UNSPECIFIED = 0;
  RISING = 1;
  FALLING = 2;
  FLAT = 3;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  STIMULUS_PRESENTED = 1;
  CUE_GIVEN = 2;
  VOCALIZATION_DETECTED = 3;
  ATTEMPT_RECORDED = 4;
  PARENT_SCORED = 5;
  SLP_SCORED = 6;
  MODEL_SCORED = 7;
  REINFORCEMENT_DELIVERED = 8;
  TRIAL_ABORTED = 9;
  CUE_ADVANCED = 10;
  CUE_BACKED_OFF = 11;
  TARGET_RETIRED_SAFETY = 12;
  AVERSION_DETECTED = 13;
  SESSION_CAPPED = 14;
}

// ============================================================================
// TIER-1 SIGNALS
// ============================================================================

message Tier1Signals {
  bool vocalization_detected = 1;
  int32 latency_ms = 2;                    // stimulus offset -> vocalization onset
  int32 duration_ms = 3;                   // phonation duration
  int32 syllable_count = 4;                // estimated (may be 0 if abstained)
  PitchContour pitch_contour = 5;
  float snr_db = 6;                        // signal-to-noise ratio
  bool abstained = 7;                      // true if SNR too low to compute signals
  string abstention_reason = 8;            // "snr_too_low", "vad_weak", etc.
}

message CueModalities {
  bool visual = 1;
  bool gestural = 2;
  bool rhythmic = 3;
  bool frame = 4;
}

// ============================================================================
// TRIAL EVENTS (IMMUTABLE LOG)
// ============================================================================

message TrialEvent {
  string event_id = 1;                    // UUIDv7
  string session_id = 2;
  string child_id = 3;
  string trial_id = 4;
  int32 ordinal = 5;                      // trial number in session
  EventType event_type = 6;
  string target_id = 7;
  CueLevel cue_level = 8;
  CueModalities cue_modalities = 9;

  google.protobuf.Timestamp client_ts = 10;  // device timestamp
  google.protobuf.Timestamp server_ts = 11;  // server ingestion timestamp
  string device_id = 12;
  string app_version = 13;
  string protocol_version = 14;
  string schema_version = 15;

  // Tier-1 signals (populated on attempt_recorded event)
  Tier1Signals tier1_signals = 16;

  // Additional metadata (event-specific)
  map<string, string> payload = 17;  // event-specific fields
}

// ============================================================================
// REQUEST/RESPONSE MESSAGES
// ============================================================================

message UploadSessionRequest {
  string device_id = 1;                    // iOS IDFV
  string session_id = 2;                   // local UUID
  string child_id = 3;                     // must match auth token
  repeated TrialEvent trial_events = 4;
  repeated AudioUploadRef audio_refs = 5;
  repeated ParentScore parent_scores = 6;
}

message AudioUploadRef {
  string attempt_id = 1;
  string s3_key = 2;
  int64 bytes = 3;
  string content_hash_sha256 = 4;         // hex-encoded
}

message ParentScore {
  string trial_id = 1;
  ScoreValue value = 2;
  google.protobuf.Timestamp tapped_at = 3;
}

message UploadSessionResponse {
  int32 accepted_count = 1;
  int32 error_count = 2;
  int32 retry_after_ms = 3;
  repeated string error_messages = 4;
}

message GetSessionTrialsRequest {
  string session_id = 1;
}

message GetSessionTrialsResponse {
  repeated TrialWithScores trials = 1;
}

message TrialWithScores {
  string trial_id = 1;
  int32 ordinal = 2;
  string target_id = 3;
  CueLevel cue_level = 4;
  repeated Score scores = 5;
  Tier1Signals tier1_signals = 6;
  google.protobuf.Timestamp created_at = 7;
}

message Score {
  string score_id = 1;
  string rater = 2;                       // "parent", "slp", "model:v1", etc.
  ScoreValue value = 3;
  float confidence = 4;                   // [0, 1]
  google.protobuf.Timestamp created_at = 5;
  string model_version = 6;               // null for human raters
}

message GetChildProgressRequest {
  string child_id = 1;
  string program_id = 2;
  int32 days_lookback = 3;                // default 84
}

message GetChildProgressResponse {
  repeated TargetProgress targets = 1;
  google.protobuf.Timestamp computed_at = 2;
}

message TargetProgress {
  string target_id = 1;
  string ipa = 2;
  float mastery_percent = 3;
  int32 trials_at_level = 4;
  int32 trials_to_criterion = 5;
  CueLevel current_cue_level = 6;
  google.protobuf.Timestamp last_attempt = 7;
  int32 total_attempts = 8;
}

message QueryTrialsRequest {
  string child_id = 1;
  google.protobuf.Timestamp date_from = 2;
  google.protobuf.Timestamp date_to = 3;
  string target_id = 4;
  EventType event_type = 5;
  int32 page_size = 6;
  string page_token = 7;
}
