syntax = "proto3";

package praxia.trial.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/praxia-ai/backend/pkg/gen/trial/v1";

// TrialService manages speech therapy trial data
service TrialService {
  rpc UploadSession(UploadSessionRequest) returns (UploadSessionResponse);
  rpc GetSessionTrials(GetSessionTrialsRequest) returns (GetSessionTrialsResponse);
  rpc GetChildProgress(GetChildProgressRequest) returns (GetChildProgressResponse);
  rpc QueryTrials(QueryTrialsRequest) returns (QueryTrialsResponse);
}

// Score enum
enum ScoreValue {
  SCORE_UNSPECIFIED = 0;
  GOT_IT = 1;
  CLOSE = 2;
  NOT_YET = 3;
}

// Trial represents a single speech therapy attempt
message Trial {
  string trial_id = 1;
  string session_id = 2;
  string child_id = 3;
  string device_id = 4;
  google.protobuf.Timestamp device_timestamp = 5;
  google.protobuf.Timestamp server_timestamp = 6;

  string target_word = 7;
  int32 cue_level = 8; // 0-5
  ScoreValue score = 9;

  // Tier 1 signals
  bool tier1_vocalization_detected = 10;
  int32 tier1_latency_ms = 11;
  float tier1_snr_db = 12;
  int32 tier1_syllable_estimate = 13;

  string audio_path = 14;
  google.protobuf.Timestamp audio_retention_expires = 15;
}

// UploadSessionRequest batch of trials from iOS
message UploadSessionRequest {
  string session_id = 1;
  string child_id = 2;
  string device_id = 3;
  repeated TrialData trials = 4;
}

message TrialData {
  string trial_id = 1;
  google.protobuf.Timestamp device_timestamp = 2;

  string target_word = 3;
  int32 cue_level = 4;
  ScoreValue score = 5;

  bool tier1_vocalization_detected = 6;
  int32 tier1_latency_ms = 7;
  float tier1_snr_db = 8;
  int32 tier1_syllable_estimate = 9;

  string audio_path = 10;
}

message UploadSessionResponse {
  int32 synced_count = 1;
  repeated string synced_trial_ids = 2;
  int32 duplicate_count = 3;
  repeated string duplicate_trial_ids = 4;
  int32 error_count = 5;
  string message = 6;
}

// GetSessionTrialsRequest
message GetSessionTrialsRequest {
  string session_id = 1;
  string child_id = 2;
}

message GetSessionTrialsResponse {
  repeated Trial trials = 1;
  int32 total_count = 2;
}

// GetChildProgressRequest
message GetChildProgressRequest {
  string child_id = 1;
  TimeRange time_range = 2;
}

enum TimeRange {
  TIME_RANGE_UNSPECIFIED = 0;
  THIS_WEEK = 1;
  THIS_MONTH = 2;
  ALL_TIME = 3;
}

message ChildProgress {
  int32 attempt_count = 1;
  float success_percentage = 2;
  map<int32, int32> cue_level_distribution = 3; // cue_level -> count
  float average_latency_ms = 4;
  float average_snr_db = 5;
}

message GetChildProgressResponse {
  ChildProgress progress = 1;
}

// QueryTrialsRequest
message QueryTrialsRequest {
  string child_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  string target_word = 4;
  int32 cue_level = 5; // -1 means all levels
  int32 limit = 6;
  int32 offset = 7;
}

message QueryTrialsResponse {
  repeated TrialDetail trials = 1;
  int32 total_count = 2;
  int32 offset = 3;
}

message TrialDetail {
  Trial trial = 1;
  string audio_status = 2; // "available", "expired", "deleted"
}
