# NATS configuration for Praxia

# Server configuration
server_name: "praxia-nats"

# Network and protocol
host: 0.0.0.0
port: 4222

# Clustering
cluster {
  host: 0.0.0.0
  port: 6222
}

# HTTP monitoring port
http_port: 8222

# Jetstream configuration
jetstream {
  store_dir: "/data"
  max_memory_store: 1GB
  max_file_store: 10GB
}

# Define streams for event sourcing
jetstream {
  # Audio processing stream
  streams = [
    {
      name: "audio-events"
      subjects: ["audio.uploaded"]
      max_msgs: 1000000
      max_bytes: 10GB
      max_age: "24h"
      storage: file
      discard: old
    },
    {
      name: "score-events"
      subjects: ["scores.tier2", "scores.tier3"]
      max_msgs: 1000000
      max_bytes: 10GB
      max_age: "24h"
      storage: file
      discard: old
    },
    {
      name: "audit-events"
      subjects: ["audit.>"]
      max_msgs: 10000000
      max_bytes: 50GB
      max_age: "90d"
      storage: file
      discard: old
    }
  ]
}

# Logging
log_file: "/data/nats.log"
logtime: true
debug: false
trace: false
